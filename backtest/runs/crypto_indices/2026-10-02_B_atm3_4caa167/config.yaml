name: B_atm3
description: 'B with liquidity (G3 zero-trade share and spread) measured on the 3
  strikes nearest the implied median instead of a +/-2% band. Added after a structural
  check (no labels involved): a fixed % band holds 1 strike for DOGE but ~400 for
  DJI, so the zero-trade share is not comparable across tickers.

  '
universe: backtest/universes/crypto_indices.yaml
snapshots: backtest/snapshots/crypto_indices
weights: config/weights_w0.yaml
weights_overrides: {}
window:
  start: '2026-08-04'
  end: '2026-09-30'
features:
  pick_hour_et: 15
  atm_band: 0.02
  volume_floor_pct: 10
  floor_window: 30
  floor_min_obs: 10
  use_adanos: true
  liquidity_strikes: 3
catalysts:
  file: backtest/catalysts/macro_2026.yaml
  applies_to:
  - index
tiers: true
cooldown: true
label: abn_move
mode: normal
seed: 7
