<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topic Log</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="episode.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%231d1f24%22/%3E%3Cpath d=%22M3 11l3-3 2 2 5-5%22 stroke=%22white%22 stroke-width=%221.6%22 fill=%22none%22/%3E%3C/svg%3E">
</head><body>
<div class="app-bar">
  <span class="name">Topic Log</span>
  <span class="status"><span class="dot" id="ab-dot"></span><span id="ab-text">Starting…</span></span>
  <span class="spacer"></span>
  <button id="ab-sched" type="button" title="Set the times of day Topic Log pulls (Chicago time)">Schedule: <span id="ab-sched-sum">…</span></button>
  <button id="ab-refresh" class="primary" type="button" title="Fetch fresh data from every source now (takes a few minutes)">Pull now</button>
  <button id="ab-reload" type="button" title="Reload the view from the data already on this Mac">Refresh view</button>
  <span id="ab-key"></span>
  <button id="ab-keybtn" type="button">Adanos key…</button>
  <span id="ab-keyform" hidden><input id="ab-keyinput" type="password" placeholder="sk_live_…" aria-label="Adanos API key" size="28"> <button id="ab-keysave" type="button">Save</button></span>
  <button id="ab-folder" type="button" title="Open Topic Log Data on the Desktop: daily files, rank history, audio, exports">Data folder</button>
  <button id="ab-quit" type="button">Quit</button>
</div>
<div id="ab-sched-panel" class="sched-panel" hidden role="dialog" aria-label="Pull schedule">
  <h3>Pull schedule <span class="muted">(Chicago time, 24-hour)</span></h3>
  <p class="muted">Topic Log pulls at these times every day. 15:15 is the pick of record (16:15 ET) and always runs.
    Changes start from the next time; saving never starts a pull. A time missed while the computer slept runs when it wakes.</p>
  <div id="sched-rows"></div>
  <div class="sched-actions">
    <button id="sched-add" type="button">+ Add time</button>
    <label><input id="sched-wk" type="checkbox"> Weekdays only</label>
  </div>
  <p id="sched-next" class="muted"></p>
  <p id="sched-err" class="err"></p>
  <div class="sched-actions">
    <button id="sched-save" type="button" class="primary">Apply</button>
    <button id="sched-cancel" type="button">Cancel</button>
  </div>
</div>
<script src="d3.min.js"></script>
<script src="shim.js"></script>
<div id="dash-root">
{{PAGE}}
</div>
<script src="appbar.js"></script>
<script src="episode.js"></script>
</body></html>
